<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英打遊戲版本三</title>
<style>
  :root { font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #243e38; background: #f5f3ec; line-height: 1.7; --k: clamp(22px, 6vw, 52px); }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1040px; margin: auto; padding: 36px 24px; }
  h1 { font-size: clamp(28px, 4.5vw, 44px); line-height: 1.3; margin: 12px 0 18px; }
  a { color: #205d50; }
  .panel { background: #fff; border: 1px solid #ccd7ce; border-radius: 20px; padding: 24px; margin: 20px 0; }
  .score { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .score span { background: #edf1e9; padding: 8px 14px; border-radius: 10px; }
  .score b { font-size: 26px; }
  .game { text-align: center; outline: none; }
  .target { font-size: 96px; font-weight: 800; line-height: 1.2; margin: 8px 0; min-height: 1.2em; }
  #message { min-height: 2em; margin: 0; color: #526459; }
  #message.error { color: #a1332e; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  button { font: inherit; padding: 12px 28px; border: 1px solid #426d5e; background: #426d5e; color: #fff; border-radius: 12px; cursor: pointer; }
  button.secondary { background: #fff; color: #284c40; }
  button:hover:not(:disabled) { filter: brightness(.95); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid #b16b35; outline-offset: 4px; }

  .keyboard { max-width: 870px; margin: 0 auto; background: #d5ddd5; padding: 14px 8px; border-radius: 18px; }
  .keyrow { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
  .key { position: relative; display: grid; place-items: center; width: var(--k); height: calc(var(--k) * .92); border-radius: 8px; border: 1px solid #98ad9e; border-bottom-width: 4px; background: #f9faf4; color: #53645a; font-size: clamp(11px, 2.6vw, 20px); font-weight: 700; user-select: none; }
  .key.home { background: #e4bbab; color: #452e25; }
  .key.lit { background: #a1332e; color: #fff; border-color: #682a28; box-shadow: 0 0 0 3px #f1d6bc; transform: translateY(-2px); }
  .key.lit::after { content: ""; position: absolute; bottom: 4px; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .key.space { width: calc(var(--k) * 9); font-size: clamp(10px, 2vw, 16px); font-weight: 500; }

  @media (max-width: 700px) {
    main { padding: 22px 14px; }
    .panel { padding: 16px; }
    .target { font-size: 72px; }
    .keyrow { gap: 3px; }
  }
</style>
</head>
<body>
<main>
  <a href="../index.html">← 回開發歷程首頁</a>
  <h1>英打遊戲版本三</h1>

  <section class="panel game" id="game" tabindex="-1">
    <div class="score"><span>分數：<b id="score">0</b></span></div>
    <div class="target" id="target" aria-live="polite">—</div>
    <p id="message" role="status">按「開始」後，依提示按下鍵盤上對應的字母。</p>
    <div class="controls">
      <button id="start" type="button">開始</button>
      <button id="stop" type="button" class="secondary" disabled>停止練習</button>
    </div>
  </section>

  <section class="panel">
    <div class="keyboard" id="keyboard" role="img" aria-label="英文鍵盤，目前要按的字母會亮起"></div>
  </section>
</main>
<script>
  const ROWS = [
    '1234567890-='.split(''),
    'QWERTYUIOP[]'.split(''),
    'ASDFGHJKL;\''.split(''),
    'ZXCVBNM,./'.split('')
  ];
  const HOME = 'ASDFGHJKL;'.split('');
  const POOL = ['A', 'S', 'D', 'F'];

  const kb = document.getElementById('keyboard');
  const keyEls = {};
  ROWS.forEach(row => {
    const r = document.createElement('div');
    r.className = 'keyrow';
    row.forEach(ch => {
      const k = document.createElement('div');
      k.className = 'key' + (HOME.includes(ch) ? ' home' : '');
      k.textContent = ch;
      keyEls[ch] = k;
      r.appendChild(k);
    });
    kb.appendChild(r);
  });
  const spaceRow = document.createElement('div');
  spaceRow.className = 'keyrow';
  const space = document.createElement('div');
  space.className = 'key space';
  space.textContent = 'SPACE';
  spaceRow.appendChild(space);
  kb.appendChild(spaceRow);

  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const scoreEl = document.getElementById('score');
  const targetEl = document.getElementById('target');
  const messageEl = document.getElementById('message');
  const game = document.getElementById('game');

  let running = false;
  let started = false;
  let score = 0;
  let target = null;

  function say(text, isError) {
    messageEl.textContent = text;
    messageEl.className = isError ? 'error' : '';
  }

  function light(letter) {
    Object.values(keyEls).forEach(k => k.classList.remove('lit'));
    if (letter) keyEls[letter].classList.add('lit');
  }

  function nextTarget() {
    const choices = POOL.filter(c => c !== target);
    target = choices[Math.floor(Math.random() * choices.length)];
    targetEl.textContent = target;
    light(target);
  }

  function start() {
    running = true;
    started = true;
    score = 0;
    scoreEl.textContent = score;
    target = null;
    nextTarget();
    startBtn.textContent = '重新開始';
    stopBtn.disabled = false;
    say('請按下亮起的字母。', false);
    game.focus();
  }

  function stop() {
    running = false;
    target = null;
    targetEl.textContent = '—';
    light(null);
    stopBtn.disabled = true;
    say('已停止練習，本次分數：' + score + '。', false);
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);

  document.addEventListener('keydown', e => {
    if (!running || e.repeat) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const m = /^Key([A-Z])$/.exec(e.code);
    if (!m) return;
    const pressed = m[1];
    if (pressed === target) {
      score += 1;
      scoreEl.textContent = score;
      say('答對了！', false);
      nextTarget();
    } else {
      say('按錯了，請按 ' + target + '。', true);
    }
  });
</script>
</body>
</html>
