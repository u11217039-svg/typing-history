<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英打遊戲開發歷程</title>
<style>
  :root { font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #243e38; background: #f5f3ec; line-height: 1.7; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1040px; margin: auto; padding: 36px 24px; }
  h1 { font-size: clamp(28px, 4.5vw, 44px); line-height: 1.3; margin: 0 0 28px; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .card { display: flex; flex-direction: column; background: #fff; border: 1px solid #ccd7ce; border-radius: 18px; padding: 24px; min-height: 240px; }
  .card h2 { font-size: 22px; margin: 0 0 8px; }
  .card p { flex: 1; margin: 0; color: #526459; }
  .action { display: inline-block; align-self: flex-start; margin-top: 16px; padding: 12px 22px; border: 1px solid #426d5e; background: #426d5e; color: #fff; border-radius: 12px; text-decoration: none; }
  .action:hover { filter: brightness(.95); }
  :focus-visible { outline: 3px solid #b16b35; outline-offset: 4px; }
  @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) {
    main { padding: 22px 14px; }
    .cards { grid-template-columns: 1fr; }
    .card { min-height: 0; }
  }
</style>
</head>
<body>
<main>
  <h1>英打遊戲開發歷程</h1>
  <section class="cards">
    <article class="card">
      <h2>版本一</h2>
      <p>最初的畫面：標題與開始按鈕。</p>
      <a class="action" href="https://u11217039-svg.github.io/typing-v1/">查看版本一</a>
    </article>
    <article class="card">
      <h2>版本二</h2>
      <p>加入鍵盤圖片，按下開始會播放嗶聲。</p>
      <a class="action" href="https://u11217039-svg.github.io/typing-v2/">查看版本二</a>
    </article>
    <article class="card">
      <h2>版本三</h2>
      <p>敬請期待。</p>
      <a class="action" href="v3/index.html">查看版本三</a>
    </article>
    <article class="card">
      <h2>版本四</h2>
      <p>字母從上方掉落，落地前按對就得分。</p>
      <a class="action" href="v4/index.html">查看版本四</a>
    </article>
  </section>
</main>
</body>
</html>
